<div class="container m-b-20 layout-row align-center space-between">
  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Filter Tiers</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput #filterInput (keyup)="applyFilter(filterInput.value)" placeholder="Search by name..." />
    </mat-form-field>
  </div>

  <div class="actions-container">
    <button mat-icon-button color="primary" (click)="loadTiers()" matTooltip="Refresh List">
      <mat-icon>refresh</mat-icon>
    </button>
    <button mat-raised-button color="primary" [routerLink]="['create']" class="m-l-10">
      <mat-icon class="m-r-5">add</mat-icon>
      Create Tier
    </button>
  </div>
</div>

<div class="container">
  <div class="modern-card content-card">
    <table mat-table [dataSource]="dataSource" matSort class="modern-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let tier">
          <div class="cell-primary">
            <mat-icon class="m-r-10 text-muted">military_tech</mat-icon>
            {{ tier.name }}
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="maxBalance">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Max Balance </th>
        <td mat-cell *matCellDef="let tier" class="text-muted">
          {{ tier.maxBalance ? (tier.maxBalance | number) : '-' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="maxTransactionAmount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Max Transaction </th>
        <td mat-cell *matCellDef="let tier" class="text-muted">
          {{ tier.maxTransactionAmount ? (tier.maxTransactionAmount | number) : '-' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let tier">
          @if (tier.active) {
            <span class="status-badge badge-active">Active</span>
          }
          @if (!tier.active) {
            <span class="status-badge badge-inactive">Inactive</span>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" [routerLink]="[row.id]" class="select-row"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons class="modern-paginator"></mat-paginator>
  </div>
</div>
