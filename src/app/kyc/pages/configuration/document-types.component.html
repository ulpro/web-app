<div class="container m-b-20 layout-row align-center space-between">
  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Filter Document Types</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput #filterInput (keyup)="applyFilter(filterInput.value)" placeholder="Search by name..." />
    </mat-form-field>
  </div>

  <div class="actions-container">
    <button mat-icon-button color="primary" (click)="loadDocumentTypes()" matTooltip="Refresh List">
      <mat-icon>refresh</mat-icon>
    </button>
    <button mat-raised-button color="primary" (click)="openCreateDialog()" class="m-l-10">
      <mat-icon class="m-r-5">add</mat-icon>
      Create Document Type
    </button>
  </div>
</div>

<div class="container">
  <div class="modern-card content-card">
    <table mat-table [dataSource]="dataSource" matSort class="modern-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let docType">
          <div class="cell-primary">
            <mat-icon class="m-r-10 text-muted">badge</mat-icon>
            {{ docType.name }}
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Description </th>
        <td mat-cell *matCellDef="let docType" class="text-muted"> {{ docType.description || '-' }} </td>
      </ng-container>

      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let docType">
          @if (docType.active) {
            <span class="status-badge badge-active">Active</span>
          }
          @if (!docType.active) {
            <span class="status-badge badge-inactive">Inactive</span>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons class="modern-paginator"></mat-paginator>
  </div>
</div>
